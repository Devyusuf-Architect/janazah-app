<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janazah Notices — coordinator console</title>
  <meta name="description" content="Publish, correct and cancel verified Janazah notices.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Single place the Firebase SDK version is pinned. Bump all three
       together. The end-to-end test swaps this map for a locally bundled
       copy so it can run without reaching the CDN. -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js",
      "firebase/messaging": "https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/12.17.1/firebase-functions.js"
    }
  }
  </script>
</head>
<body>
  <p id="env-banner" class="env-banner" hidden>
    Connected to local Firebase emulators. Nothing here touches production.
  </p>

  <header class="masthead">
    <a class="brand" href="/console">
      <span class="brand__mark" aria-hidden="true">◆</span>
      <span>Janazah Notices <span class="brand__sub">console</span></span>
    </a>
    <nav id="nav" class="nav" hidden></nav>
  </header>

  <main id="view" class="view">
    <p class="muted">Loading…</p>
  </main>

  <footer class="footer">
    <p>
      Coordinator and administrator console.
      <a class="link" href="/">View the public feed</a>.
    </p>
    <p class="muted">
      A user's location is never stored by this application. See
      <code>docs/phase-1-setup.md</code>.
    </p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
