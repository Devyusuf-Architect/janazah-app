<!--
  Ta'ziyah's mark: a masjid, dome and minaret and crescent, held in a
  cupping hand, with a leaf sprig beside it. The one source for every place
  the mark appears: the masthead brand, the favicon, and the app icons.
  Generating a PNG from this file, rather than hand-drawing raster icons
  separately, is what keeps all of them in agreement; see
  scripts/build-logo-icons.mjs.

  XML comments may not contain a literal double hyphen, which is why this
  reads as plain prose rather than the app's usual dashes: an SVG loaded via
  <img src> is parsed as strict XML, and Chromium fails that parse (and
  therefore the whole image, silently: naturalWidth 0, no console error)
  on a comment that breaks the grammar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#14503f"/>
  <g fill="#faf7f2">

    <!-- ================= leaf sprig, upper left ================= -->
    <path d="M25 60 C24 52 25 44 29 37" stroke="#faf7f2" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M25 54
             C18 51.5 15 45 17 38.5
             C24 40.5 28.5 46.5 27.5 53.5
             C26.7 54 25.8 54.1 25 54 Z"/>
    <path d="M29 43
             C23.5 39.7 21.7 33 24.3 27
             C30 29.6 33.6 35.4 31.7 41.6
             C30.8 42.1 29.9 42.4 29 43 Z"/>

    <!-- ================= minaret ================= -->
    <path d="M75.4 24 L77 19 L78.6 24 Z"/>
    <rect x="76.2" y="24" width="1.6" height="3.4"/>
    <rect x="74.4" y="27.4" width="5.2" height="3" rx="0.4"/>
    <path d="M72.8 30.8 h9.4 l-1.7 3.3 h-6 z"/>
    <rect x="75.7" y="34.4" width="2.6" height="31.6"/>
    <rect x="73.9" y="39" width="6.2" height="2.2" rx="0.4"/>
    <rect x="73.9" y="51.5" width="6.2" height="2.2" rx="0.4"/>

    <!-- ================= dome finial + crescent ================= -->
    <rect x="56.2" y="30" width="1.6" height="6"/>
    <circle cx="57" cy="28.4" r="1.7"/>
    <path fill-rule="evenodd" d="
      M52 20
      a7.6 7.6 0 1 0 0.3 15.2
      a9.3 9.3 0 1 1 -0.3 -15.2 Z"/>

    <!-- ================= dome ================= -->
    <path d="M44.5 74
             C44.5 52.5 49.7 39.4 57 39.4
             C64.3 39.4 69.5 52.5 69.5 74
             Z"/>

    <!-- ============ landscape wave flowing into a cupping hand ========== -->
    <!-- the wave: unchanged, this part already reads well -->
    <path d="
      M16 73
      C22 68 30 67.6 37 70.8
      C45.5 74.6 54.5 74.6 63 70.8
      C68.4 68.3 74 67.8 79 70
      L79 78 L16 78 Z"/>

    <!-- the hand: a palm, four gently rounded fingers curling over the
         top, and a thumb held apart and angled outward on the right so it
         cannot be mistaken for a fifth finger. Every fingertip is built from
         two curves that meet with a level tangent, which is what keeps a
         rounded tip from reading as a claw. A single crease line does the
         rest of the work of saying "palm" without adding more silhouette
         detail than a small mark can hold. -->
    <path d="
      M13 83
      C12.3 76.6 16.6 70.9 23 69.8
      C27.8 69 32.2 71 34.6 74.6

      C35.5 70.6 38.5 67.6 42.2 67.6
      C45.9 67.6 48.7 70.3 49.4 74.1

      C50.4 70.1 53.4 67.4 56.8 67.4
      C60.2 67.4 62.9 70 63.7 73.8

      C64.9 70 68 67.5 71.4 67.7
      C74.5 67.9 76.9 70.2 77.6 73.4

      C79.6 70.4 82.4 68.4 85.2 68.6
      C88.8 68.8 91.6 71.6 92.4 75.6
      C92.9 78.1 91.6 80.4 89.3 81
      C88.2 78.3 86.2 76.3 83.6 75.6
      C84.5 77.6 84.7 79.8 84.1 82

      C81.2 79 77.4 77.4 73.4 77.6

      C64.6 74.8 55 74 46 76
      C43.4 76.6 41 77.5 38.8 78.7

      C31.6 82.6 22.6 82.4 15.6 78.1
      C13.9 77 12.8 79 13 83 Z"/>
    <path d="M30 76 C40 79.4 51 80 61.5 78" stroke="#14503f" stroke-width="0.9"
          fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
